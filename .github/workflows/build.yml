name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk BackupBallxPit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BackupBallxPit
          path: BackupBallxPit.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2-${{ github.run_number }}
          name: Backup Ball x Pit v1.2 (build ${{ github.run_number }})
          files: BackupBallxPit.apk
